<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Courses">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111112">
<title>Courses</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111112;
    --charcoal: #3B3B3D;
    --shallow: #EDE3D1;
    --sun: #D5BA8C;
    --gold-text: #9C7C47;
    --paper: #F5F0E8;
    --line: #E4DCCD;
    --muted: #6E6A63;
    --down: #A5483A;
    --up: #4F7A5A;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif; font-weight: 400; font-size: 15px; line-height: 1.55;
    -webkit-text-size-adjust: 100%; }
  b, strong { font-weight: 600; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }

  .app { max-width: 560px; margin: 0 auto; padding: 0 18px calc(88px + env(safe-area-inset-bottom)); }

  /* ── Top bar ── */
  .topbar { background: var(--ink); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 18px 14px; }
  .topbar .in { max-width: 560px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: grid; line-height: 1; text-align: center; }
  .brand .w1 { font-size: 21px; font-weight: 400; letter-spacing: .14em; }
  .brand .w2 { font-size: 10.5px; font-weight: 400; letter-spacing: .16em; margin-top: 4px; color: #CBCBCB; }
  .asof { font-size: 12px; color: #CBCBCB; letter-spacing: .04em; text-align: right; }
  .asof b { color: var(--sun); font-weight: 500; letter-spacing: .12em; text-transform: uppercase; display: block; font-size: 11px; margin-bottom: 3px; }
  .sync { display: inline-flex; align-items: center; gap: 6px; }
  .sync.error { color: #E3A193; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; background: #9CC7A4; flex-shrink: 0; }
  .sync-dot.syncing { background: var(--sun); animation: pulse 1s infinite; }
  .sync-dot.error { background: #E3A193; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ── Hero ── */
  .card { background: #fff; border: 1px solid var(--line); border-radius: 2px; padding: 16px; margin-top: 12px; }
  .hero.card { background: var(--ink); border: 0; border-left: 2px solid var(--sun); color: #fff; padding: 22px 20px 20px; margin-top: 18px; }
  .hero .fig { font-size: 42px; font-weight: 300; line-height: 1.05; color: var(--sun); }
  .hero .cap { color: #CBCBCB; font-size: 14px; margin-top: 8px; }
  .bar { height: 4px; background: var(--charcoal); overflow: hidden; margin-top: 16px; }
  .bar i { display: block; height: 100%; background: var(--sun); width: 0; }

  h2 { font-size: 12px; font-weight: 500; letter-spacing: .12em; text-transform: uppercase; color: var(--gold-text);
    margin: 30px 0 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  h2 .count { color: var(--muted); font-weight: 500; letter-spacing: .06em; }

  /* ── Add form ── */
  .form-row { display: flex; gap: 8px; }
  input, select { border: 1px solid var(--line); background: #fff; border-radius: 2px; padding: 11px 12px; width: 100%; font-size: 16px; outline: none; }
  input:focus, select:focus { border-color: var(--sun); }
  input::placeholder { color: #A9A39A; }
  .btn { background: var(--ink); color: #fff; border: 0; border-radius: 2px; padding: 12px 16px; font-weight: 500; font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; flex: none; }
  .add-btn { width: 46px; padding: 0; font-size: 22px; font-weight: 300; letter-spacing: 0; }

  .add-wrap { position: relative; flex: 1; }
  .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; list-style: none; margin: 0; padding: 4px 0;
    background: #fff; border: 1px solid var(--line); border-radius: 2px; box-shadow: 0 8px 24px rgba(17,17,18,.08); }
  .suggest[hidden] { display: none; }
  .sg { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 11px 12px; cursor: pointer; }
  .sg + .sg { border-top: 1px solid #F1ECE3; }
  .sg b { font-weight: 600; }
  .sg.active, .sg:hover { background: var(--paper); }
  .sg-cat { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .sg.in-list { color: #A9A39A; cursor: default; }
  .sg.in-list .sg-cat { color: var(--gold-text); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 0 2px; scrollbar-width: none; margin: 0 -16px; padding-left: 16px; padding-right: 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: #fff; border-radius: 2px; padding: 6px 14px; font-size: 13px; letter-spacing: .03em; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* ── Quick add (favourites) ── */
  .quick-toggle { width: 100%; background: none; border: 0; padding: 0; text-align: left; }
  .quick-toggle h2 { margin-bottom: 0; }
  .arrow { display: inline-block; transition: transform .2s; color: var(--muted); }
  .arrow.open { transform: rotate(180deg); }
  .quick-panel { display: none; }
  .quick-panel.open { display: block; }
  .quick-section + .quick-section { margin-top: 14px; }
  .quick-label { font-size: 12px; color: var(--muted); letter-spacing: .04em; margin-bottom: 6px; }
  .fav-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .fav-chip { border: 1px solid var(--line); background: #fff; border-radius: 2px; padding: 5px 11px; font-size: 13px; color: var(--ink); }
  @media (hover: hover) { .fav-chip:not(.in-list):hover { background: var(--ink); color: #fff; border-color: var(--ink); } }
  .fav-chip.in-list { background: var(--shallow); border-color: var(--shallow); color: var(--gold-text); cursor: default; }
  .fav-chip .fav-del { margin-left: 6px; color: var(--down); }
  .quick-panel.editing .fav-chip { border-style: dashed; border-color: #CFC4B1; }
  .edit-row { display: flex; align-items: center; gap: 8px; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
  .edit-hint { flex: 1; font-size: 12px; color: var(--muted); font-style: italic; }
  .link-btn { margin-left: auto; background: none; border: 0; padding: 4px 0; color: var(--gold-text); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; font-weight: 600; }
  .new-fav-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 12px; }
  .new-fav-form select { grid-column: 1 / -1; grid-row: 2; }
  .new-fav-form .btn { grid-row: 1; grid-column: 2; }

  /* ── List ── */
  .list { list-style: none; margin: 0; padding: 0 16px; }
  .item-row { display: flex; align-items: center; gap: 12px; padding: 13px 0; border-bottom: 1px solid var(--line); }
  .item-row:last-child { border-bottom: 0; }
  .chk { width: 22px; height: 22px; border-radius: 2px; border: 1.5px solid var(--ink); background: #fff; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 12px; padding: 0; color: var(--sun); transition: background .15s; }
  .chk.done { background: var(--ink); }
  .item-name { flex: 1; font-size: 15px; line-height: 1.35; word-break: break-word; }
  .item-name.done { color: #A9A39A; text-decoration: line-through; }
  .del { opacity: 0; width: 32px; height: 32px; border: 0; background: transparent; color: var(--muted); font-size: 20px; font-weight: 300;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: opacity .1s, color .1s; }
  .item-row:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--down); }
  @media (hover: none) { .del { opacity: .55; } }

  .empty { color: var(--muted); font-size: 14px; padding: 28px 0; text-align: center; }
  .notice { background: #fff; border: 1px solid var(--line); border-left: 2px solid var(--sun); padding: 10px 12px; font-size: 12px; font-style: italic; color: var(--muted); margin-top: 18px; }

  /* ── Bottom bar ── */
  .bottombar { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  .bottombar .in { max-width: 560px; margin: 0 auto; padding: 12px 18px; display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; }
  .ft-note { font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .clear-btn { background: none; border: 1px solid var(--down); color: var(--down); border-radius: 2px; padding: 8px 12px; font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }

  @media (prefers-reduced-motion: no-preference) { .bar i { transition: width .6s ease; } }
  @media (prefers-reduced-motion: reduce) { .sync-dot.syncing { animation: none; } }
</style>
</head>
<body>
<header class="topbar"><div class="in">
  <span class="brand" aria-label="Courses, notre liste"><span class="w1">COURSES</span><span class="w2">NOTRE LISTE</span></span>
  <span class="asof"><b>Liste partagée</b><span class="sync" id="sync-wrap"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">Synchronisé</span></span></span>
</div></header>

<div class="app">

  <section class="hero card" aria-live="polite">
    <div class="fig" id="stat-left">0</div>
    <div class="cap" id="stat-cap">article à acheter</div>
    <div class="bar"><i id="progress-fill"></i></div>
  </section>

  <h2>Ajouter</h2>
  <div class="card">
    <div class="form-row">
      <div class="add-wrap">
        <input id="item-input" placeholder="Ajouter un article…" autocomplete="off" autocorrect="off" enterkeyhint="done"
          role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggest">
        <ul class="suggest" id="suggest" role="listbox" hidden></ul>
      </div>
      <button class="btn add-btn" data-act="add" aria-label="Ajouter">+</button>
    </div>
    <div class="chips" id="cat-pills"></div>
  </div>

  <button class="quick-toggle" data-act="quick" aria-expanded="false" id="quick-toggle">
    <h2><span>Ajout rapide, favoris</span><span class="arrow" id="quick-arrow">▾</span></h2>
  </button>
  <div class="quick-panel" id="quick-panel">
    <div class="card">
      <div id="quick-chips"></div>
      <div class="edit-row">
        <span class="edit-hint" id="edit-hint" style="display:none">Touchez un favori pour le supprimer</span>
        <button class="link-btn" id="edit-fav-btn" data-act="edit-favs">Modifier les favoris</button>
      </div>
      <form id="new-fav-form" class="new-fav-form" style="display:none">
        <input id="new-fav-name" placeholder="Nouveau favori…" autocomplete="off">
        <button type="submit" class="btn">Ajouter</button>
        <select id="new-fav-cat"></select>
      </form>
    </div>
  </div>

  <div id="list-area"></div>

  <div id="install-banner" class="notice" style="display:none">Ajoutez l'app à l'écran d'accueil pour l'ouvrir en plein écran.</div>
</div>

<nav class="bottombar"><div class="in">
  <span class="ft-note">Synchro auto toutes les 10 s</span>
  <button class="clear-btn" id="clear-btn" data-act="clear" style="display:none">Effacer les faits</button>
</div></nav>

<script>
// ─── CONFIG ──────────────────────────────────────────────────────────────────
// Servie par Apps Script (lien /exec) : rien à configurer.
// Hébergée ailleurs : colle l'URL /exec ici.
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw5p572zN0O5rGzXglDz9-gIkNUeJ6ClAvSxCsafxkWpOZj-xFs-tPbxU56aHkPKz468A/exec";
const TOKEN   = "";      // même valeur que TOKEN dans Code.gs (vide = désactivé)
const POLL_MS = 10000;
const LS_KEY  = "courses-v2";

// ─── DATA ────────────────────────────────────────────────────────────────────
const CATEGORIES = [
  { id: "produce",    label: "Fruits & Légumes",      emoji: "🥦", color: "#4a7c59" },
  { id: "dairy",      label: "Produits laitiers",     emoji: "🧀", color: "#c2853a" },
  { id: "meat",       label: "Viandes & Poissons",    emoji: "🥩", color: "#a84d4d" },
  { id: "bakery",     label: "Boulangerie",           emoji: "🍞", color: "#b5813e" },
  { id: "pantry",     label: "Épicerie",              emoji: "🥫", color: "#6b7a3e" },
  { id: "hot_drinks", label: "Boissons chaudes",      emoji: "☕", color: "#7a4f2e" },
  { id: "soft",       label: "Soft & Boissons",       emoji: "🥤", color: "#3a6b8a" },
  { id: "frozen",     label: "Surgelés",              emoji: "🧊", color: "#5a7fa8" },
  { id: "cleaning",   label: "Produits de nettoyage", emoji: "🧹", color: "#5a6e7a" },
  { id: "hygiene",    label: "Hygiène",               emoji: "🚿", color: "#7a5a8a" },
  { id: "other",      label: "Autre",                 emoji: "🛒", color: "#7a6b8a" },
];
const CAT_IDS = new Set(CATEGORIES.map(c => c.id));

const DEFAULT_FAVS = [
  {name:"Tomates",category:"produce"},{name:"Oignons",category:"produce"},{name:"Ail",category:"produce"},
  {name:"Salade",category:"produce"},{name:"Carottes",category:"produce"},{name:"Bananes",category:"produce"},
  {name:"Pommes",category:"produce"},{name:"Pommes de terre",category:"produce"},{name:"Courgettes",category:"produce"},
  {name:"Poivrons",category:"produce"},{name:"Concombre",category:"produce"},{name:"Champignons",category:"produce"},
  {name:"Citrons",category:"produce"},{name:"Avocats",category:"produce"},{name:"Oranges / Clémentines",category:"produce"},
  {name:"Herbes fraîches (persil, basilic…)",category:"produce"},
  {name:"Lait",category:"dairy"},{name:"Œufs",category:"dairy"},{name:"Beurre",category:"dairy"},
  {name:"Yaourt",category:"dairy"},{name:"Fromage",category:"dairy"},{name:"Crème fraîche",category:"dairy"},
  {name:"Mozzarella",category:"dairy"},{name:"Parmesan râpé",category:"dairy"},
  {name:"Poulet",category:"meat"},{name:"Bœuf haché",category:"meat"},{name:"Steak haché",category:"meat"},
  {name:"Poisson",category:"meat"},{name:"Saumon",category:"meat"},{name:"Crevettes",category:"meat"},
  {name:"Boulettes de viande",category:"meat"},{name:"Lardons",category:"meat"},{name:"Jambon",category:"meat"},
  {name:"Merguez / Saucisses",category:"meat"},
  {name:"Pain",category:"bakery"},{name:"Pain de mie",category:"bakery"},{name:"Wraps",category:"bakery"},
  {name:"Croissants / Pains au chocolat",category:"bakery"},{name:"Brioche",category:"bakery"},
  {name:"Pâte feuilletée / Pâte brisée",category:"bakery"},
  {name:"Pâtes",category:"pantry"},{name:"Riz",category:"pantry"},{name:"Huile d'olive",category:"pantry"},
  {name:"Vinaigre",category:"pantry"},{name:"Tomates en boîte",category:"pantry"},{name:"Sauce tomate",category:"pantry"},
  {name:"Pesto",category:"pantry"},{name:"Céréales",category:"pantry"},{name:"Flocons d'avoine",category:"pantry"},
  {name:"Sel",category:"pantry"},{name:"Poivre",category:"pantry"},{name:"Épices (cumin, paprika, curry…)",category:"pantry"},
  {name:"Miel",category:"pantry"},{name:"Confiture",category:"pantry"},{name:"Farine",category:"pantry"},
  {name:"Sucre",category:"pantry"},{name:"Canderel",category:"pantry"},{name:"Sauce soja",category:"pantry"},
  {name:"Moutarde",category:"pantry"},{name:"Ketchup",category:"pantry"},
  {name:"Conserves (maïs, haricots, lentilles…)",category:"pantry"},{name:"Chocolat",category:"pantry"},
  {name:"Nutella",category:"pantry"},{name:"Biscuits",category:"pantry"},{name:"Barres de céréales",category:"pantry"},{name:"Fruits secs / Noix",category:"pantry"},{name:"Purée de fruits",category:"pantry"},
  {name:"Café",category:"hot_drinks"},{name:"Thé Vanille & Coco",category:"hot_drinks"},{name:"Tisane",category:"hot_drinks"},
  {name:"Bière",category:"soft"},{name:"Bière Zéro",category:"soft"},{name:"Soda",category:"soft"},
  {name:"Coca",category:"soft"},{name:"Coca Zéro",category:"soft"},{name:"Jus",category:"soft"},
  {name:"Eau gazeuse",category:"soft"},{name:"Sirop",category:"soft"},
  {name:"Glace",category:"frozen"},{name:"Quiche",category:"frozen"},{name:"Feuilleté",category:"frozen"},
  {name:"Poêlée de légumes",category:"frozen"},{name:"Frites",category:"frozen"},{name:"Légumes mélangés surgelés",category:"frozen"},
  {name:"Produit sol",category:"cleaning"},{name:"Éponges carrées",category:"cleaning"},
  {name:"Éponges plates",category:"cleaning"},{name:"Lessive",category:"cleaning"},
  {name:"Sacs poubelle",category:"cleaning"},{name:"Papier essuie-tout",category:"cleaning"},
  {name:"Nettoyant multi-surfaces",category:"cleaning"},
  {name:"Papier toilette",category:"hygiene"},{name:"Savon / Gel douche",category:"hygiene"},
  {name:"Shampoing",category:"hygiene"},{name:"Dentifrice",category:"hygiene"},
  {name:"Déodorant",category:"hygiene"},{name:"Mouchoirs",category:"hygiene"},{name:"Coton-tiges",category:"hygiene"},
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let items     = [];
let favs      = [...DEFAULT_FAVS];
let favsInit  = false;   // le serveur a-t-il déjà ses favoris ?
let queue     = [];      // modifications pas encore confirmées par le serveur
let sending   = false;
let polling   = false;
let netError  = false;
let localRev  = 0;       // incrémenté à chaque modification locale
let retryTimer = null;
let selCat    = "other";
let quickOpen = false;
let editFavs  = false;
let catTouched = false;  // catégorie choisie à la main pour l'article en cours
let sugg = [], activeSugg = -1;
let history = {};        // articles déjà ajoutés sur ce téléphone : nom → catégorie, nb d'ajouts
const HIST_KEY = "courses-history";

const viaGAS = typeof google !== "undefined" && !!(google.script && google.script.run);
const configured = viaGAS || !APPS_SCRIPT_URL.includes("COLLE_TON_URL");

function uid() { return Math.random().toString(36).slice(2) + Date.now().toString(36); }
function getCat(id) { return CATEGORIES.find(c => c.id === id) || CATEGORIES.at(-1); }
function normCat(id) { return CAT_IDS.has(id) ? id : "other"; }
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
function plural(n, word) { return n === 1 ? word : word + "s"; }
function favKey(f) { return f.name.trim().toLowerCase() + "|" + normCat(f.category); }

// ─── LOCAL CACHE (affichage instantané + modifs hors ligne conservées) ────────
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify({ items, favs, favsInit, queue })); } catch (e) {}
}
function restore() {
  try {
    const s = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (!s) return;
    if (Array.isArray(s.items)) items = s.items;
    if (Array.isArray(s.favs))  favs  = s.favs;
    favsInit = !!s.favsInit;
    if (Array.isArray(s.queue)) queue = s.queue;
  } catch (e) {}
}

// ─── API ─────────────────────────────────────────────────────────────────────
async function api(payload) {
  const body = { ...payload, token: TOKEN };
  let data;
  if (viaGAS) {
    data = await new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).rpc(body));
  } else {
    data = await viaFetch(body);
  }
  if (!data) throw new Error("Réponse vide");
  if (data.error) { const err = new Error(data.error); err.fatal = !!data.fatal; throw err; }
  return data;
}

async function viaFetch(body) {
  const res = await fetch(APPS_SCRIPT_URL, {
    method: "POST",
    redirect: "follow",
    body: JSON.stringify(body), // text/plain : pas de preflight CORS
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function applyServer(s) {
  if (Array.isArray(s.items)) {
    items = s.items.map(i => ({ ...i, category: normCat(i.category) }));
  }
  if (Array.isArray(s.favs)) {
    favs = s.favs.map(f => ({ ...f, category: normCat(f.category) }));
    favsInit = true;
  } else if (s.favs === null) {
    favsInit = false;
    ensureFavsInit();       // premier lancement : on envoie les favoris par défaut
  }
  persist();
  render();
}

// Envoie les modifications une par une, dans l'ordre. En cas de coupure,
// elles restent en file (et dans le cache) et repartent automatiquement.
async function flush() {
  if (!configured || sending || !queue.length) return;
  sending = true; updateSync();
  while (queue.length) {
    let res;
    try {
      res = await api(queue[0]);
    } catch (e) {
      if (e.fatal) {                 // requête refusée : inutile de réessayer
        console.warn("Opération ignorée :", e.message, queue[0]);
        queue.shift(); persist();
        continue;
      }
      console.error(e);
      netError = true; sending = false; updateSync();
      scheduleRetry();
      return;
    }
    queue.shift(); netError = false; persist();
    if (!queue.length) applyServer(res);   // état serveur fiable : plus rien en attente
  }
  sending = false; updateSync();
}

function scheduleRetry() {
  clearTimeout(retryTimer);
  retryTimer = setTimeout(flush, 5000);
}

async function poll() {
  if (!configured || document.hidden || sending || polling || queue.length) return;
  polling = true; updateSync();
  const rev = localRev;
  try {
    const res = await api({ action: "getAll" });
    netError = false;
    // Une modification locale a eu lieu pendant la requête : réponse périmée
    if (rev === localRev && !queue.length) applyServer(res);
  } catch (e) {
    console.error(e);
    netError = true;
  }
  polling = false; updateSync();
}

// Applique tout de suite en local, puis met l'opération en file d'envoi
function mutate(op, applyLocal) {
  applyLocal();
  localRev++;
  queue.push(op);
  persist();
  render();
  flush();
}

function ensureFavsInit() {
  if (favsInit) return;
  favsInit = true;
  // push (pas unshift) : queue[0] est peut-être en cours d'envoi
  queue.push({ action: "initFavs", favs: favs.map(f => ({ ...f })) });
  persist();
  flush();
}

// ─── SYNC STATE ──────────────────────────────────────────────────────────────
function updateSync() {
  const wrap = document.getElementById("sync-wrap");
  const dot  = document.getElementById("sync-dot");
  const lbl  = document.getElementById("sync-label");
  const pending = queue.length;
  let state = "ok", text = "Synchronisé";
  if (!configured)            { state = "error";   text = "URL non configurée"; }
  else if (netError)          { state = "error";   text = "Hors ligne" + (pending ? ` · ${pending} en attente` : ""); }
  else if (sending || polling){ state = "syncing"; text = "Synchro…"; }
  dot.className  = "sync-dot" + (state === "ok" ? "" : " " + state);
  wrap.className = "sync" + (state === "error" ? " error" : "");
  lbl.textContent = text;
}

// ─── SUGGESTIONS ─────────────────────────────────────────────────────────────
function norm(s) { return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim(); }

function loadHistory() {
  try { history = JSON.parse(localStorage.getItem(HIST_KEY) || "{}") || {}; } catch (e) { history = {}; }
}
function remember(name, category) {
  const k = norm(name);
  const h = history[k] || { n: 0 };
  history[k] = { name, category, n: h.n + 1 };
  try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) {}
}

// Favoris + articles déjà ajoutés + articles de la liste actuelle
function candidates() {
  const map = new Map();
  favs.forEach(f => map.set(norm(f.name), { name: f.name, category: normCat(f.category), n: 0 }));
  Object.entries(history).forEach(([k, h]) => {
    const c = map.get(k);
    if (c) c.n = h.n; else map.set(k, { name: h.name, category: normCat(h.category), n: h.n });
  });
  items.forEach(i => {
    const k = norm(i.name);
    if (!map.has(k)) map.set(k, { name: i.name, category: normCat(i.category), n: 0 });
  });
  return [...map.values()];
}

function findSuggestions(q) {
  const nq = norm(q);
  if (!nq) return [];
  return candidates().map(c => {
    const nn = norm(c.name);
    let score = 0;
    if (nn.startsWith(nq)) score = 3;                                   // "to" → Tomates
    else if (nn.split(/[\s/(),'’-]+/).some(w => w.startsWith(nq))) score = 2; // "terre" → Pommes de terre
    else if (nq.length >= 3 && nn.includes(nq)) score = 1;            // milieu de mot, à partir de 3 lettres
    return { ...c, score };
  }).filter(c => c.score > 0)
    .sort((a, b) => b.score - a.score || b.n - a.n || a.name.localeCompare(b.name, "fr"))
    .slice(0, 6);
}

function highlight(name, q) {
  const i = name.toLowerCase().indexOf(q.trim().toLowerCase());
  if (!q.trim() || i < 0) return esc(name);
  const j = i + q.trim().length;
  return esc(name.slice(0, i)) + "<b>" + esc(name.slice(i, j)) + "</b>" + esc(name.slice(j));
}

function renderSuggest() {
  const input = document.getElementById("item-input");
  const el = document.getElementById("suggest");
  sugg = findSuggestions(input.value);
  if (!sugg.length || document.activeElement !== input) {
    el.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant");
    return;
  }
  const inList = new Set(items.filter(i => !i.checked).map(i => norm(i.name)));
  el.innerHTML = sugg.map((s, i) => {
    const already = inList.has(norm(s.name));
    return `<li role="option" id="sg-${i}" class="sg ${i === activeSugg ? "active" : ""} ${already ? "in-list" : ""}"
      data-act="sugg" data-i="${i}" aria-selected="${i === activeSugg}">
      <span>${highlight(s.name, input.value)}</span>
      <span class="sg-cat">${already ? "Déjà dans la liste" : esc(getCat(s.category).label)}</span></li>`;
  }).join("");
  el.hidden = false;
  input.setAttribute("aria-expanded", "true");
  if (activeSugg >= 0) input.setAttribute("aria-activedescendant", "sg-" + activeSugg);
  else input.removeAttribute("aria-activedescendant");
}

function hideSuggest() {
  activeSugg = -1;
  document.getElementById("suggest").hidden = true;
  document.getElementById("item-input").setAttribute("aria-expanded", "false");
}

// Choisir une suggestion : l'ajoute directement, dans sa catégorie
function pickSuggestion(i) {
  const s = sugg[i];
  if (!s) return;
  const input = document.getElementById("item-input");
  const already = items.some(it => !it.checked && norm(it.name) === norm(s.name));
  if (!already) {
    const item = { id: uid(), name: s.name, category: s.category, checked: false, addedAt: new Date().toISOString() };
    remember(s.name, s.category);
    mutate({ action: "add", item }, () => items.push(item));
  }
  input.value = "";
  catTouched = false;
  hideSuggest();
  input.focus();
}

// En tapant un nom connu, la bonne catégorie se sélectionne toute seule
function autoCategory() {
  if (catTouched) return;
  const nq = norm(document.getElementById("item-input").value);
  const match = nq && candidates().find(c => norm(c.name) === nq);
  if (match && match.category !== selCat) { selCat = match.category; renderCatPills(); }
}

// ─── ACTIONS ─────────────────────────────────────────────────────────────────
function addItem() {
  const input = document.getElementById("item-input");
  const name = input.value.trim();
  if (!name) return;
  const item = { id: uid(), name, category: selCat, checked: false, addedAt: new Date().toISOString() };
  remember(name, selCat);
  mutate({ action: "add", item }, () => items.push(item));
  input.value = "";
  catTouched = false;
  hideSuggest();
  input.focus();
}

function quickAdd(name, cat) {
  remember(name, cat);
  const exists = items.some(i => i.name.toLowerCase() === name.toLowerCase() && !i.checked);
  if (exists) return;
  const item = { id: uid(), name, category: cat, checked: false, addedAt: new Date().toISOString() };
  mutate({ action: "add", item }, () => items.push(item));
}

function toggleItem(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  const checked = !item.checked;
  mutate({ action: "setChecked", id, checked }, () => { item.checked = checked; });
}

function removeItem(id) {
  mutate({ action: "remove", id }, () => { items = items.filter(i => i.id !== id); });
}

function clearChecked() {
  const ids = items.filter(i => i.checked).map(i => i.id);
  if (!ids.length) return;
  mutate({ action: "clearChecked", ids }, () => { items = items.filter(i => !i.checked); });
}

function addFav(e) {
  e.preventDefault();
  const nameEl = document.getElementById("new-fav-name");
  const catEl  = document.getElementById("new-fav-cat");
  const fav = { name: nameEl.value.trim(), category: catEl.value };
  if (!fav.name) return;
  nameEl.value = "";
  if (favs.some(f => favKey(f) === favKey(fav))) return;
  ensureFavsInit();
  mutate({ action: "addFav", fav }, () => favs.push(fav));
}

function removeFav(idx) {
  const fav = favs[idx];
  if (!fav) return;
  ensureFavsInit();
  mutate({ action: "removeFav", fav: { ...fav } }, () => { favs.splice(idx, 1); });
}

function toggleQuick() {
  quickOpen = !quickOpen;
  document.getElementById("quick-panel").classList.toggle("open", quickOpen);
  document.getElementById("quick-toggle").setAttribute("aria-expanded", quickOpen);
  document.getElementById("quick-arrow").classList.toggle("open", quickOpen);
}

function toggleEditFavs() {
  editFavs = !editFavs;
  document.getElementById("edit-fav-btn").textContent = editFavs ? "Terminer" : "Modifier les favoris";
  document.getElementById("new-fav-form").style.display = editFavs ? "grid" : "none";
  document.getElementById("edit-hint").style.display = editFavs ? "" : "none";
  document.getElementById("quick-panel").classList.toggle("editing", editFavs);
  renderQuickChips();
}

function selectCat(id) {
  selCat = normCat(id);
  renderCatPills();
}

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  renderCatPills();
  renderList();
  renderQuickChips();
  renderCounts();
}

function renderCounts() {
  const total   = items.length;
  const checked = items.filter(i => i.checked).length;
  const left    = total - checked;
  const pct     = total > 0 ? Math.round((checked / total) * 100) : 0;

  document.getElementById("stat-left").textContent = left;
  document.getElementById("stat-cap").textContent =
    total === 0 ? "La liste est vide"
    : plural(left, "article") + " à acheter" + (checked ? ", " + checked + " " + plural(checked, "fait") + " sur " + total : "");
  document.getElementById("progress-fill").style.width = pct + "%";

  const clearBtn = document.getElementById("clear-btn");
  if (checked > 0) {
    clearBtn.style.display = "";
    clearBtn.textContent = "Effacer " + checked + " " + plural(checked, "fait");
  } else {
    clearBtn.style.display = "none";
  }
}

function renderCatPills() {
  document.getElementById("cat-pills").innerHTML = CATEGORIES.map(c =>
    `<button class="chip" data-act="cat" data-cat="${c.id}" aria-pressed="${selCat === c.id}">${esc(c.label)}</button>`
  ).join("");
}

function renderList() {
  const area = document.getElementById("list-area");
  const grouped = CATEGORIES.map(cat => ({
    cat, rows: items.filter(i => normCat(i.category) === cat.id)
  })).filter(g => g.rows.length > 0);

  if (grouped.length === 0) {
    area.innerHTML = `<h2>La liste</h2><div class="card empty">Rien à acheter pour l'instant. Ajoutez un article ou piochez dans vos favoris.</div>`;
    return;
  }

  area.innerHTML = grouped.map(({ cat, rows }) => `
    <h2><span>${esc(cat.label)}</span><span class="count">${rows.filter(r => !r.checked).length} / ${rows.length}</span></h2>
    <ul class="card list">
      ${rows.map(item => `
        <li class="item-row">
          <button class="chk ${item.checked ? "done" : ""}" data-act="toggle" data-id="${esc(item.id)}"
            aria-label="${item.checked ? "Décocher" : "Cocher"} ${esc(item.name)}">${item.checked ? "✓" : ""}</button>
          <span class="item-name ${item.checked ? "done" : ""}">${esc(item.name)}</span>
          <button class="del" data-act="del" data-id="${esc(item.id)}" aria-label="Supprimer ${esc(item.name)}">×</button>
        </li>
      `).join("")}
    </ul>
  `).join("");
}

function renderQuickChips() {
  const inList = new Set(items.filter(i => !i.checked).map(i => i.name.toLowerCase()));
  document.getElementById("quick-chips").innerHTML = CATEGORIES.map(cat => {
    const chips = favs
      .map((fav, idx) => ({ fav, idx }))
      .filter(({ fav }) => normCat(fav.category) === cat.id)
      .map(({ fav, idx }) => {
        const already = !editFavs && inList.has(fav.name.toLowerCase());
        return `<button class="fav-chip ${already ? "in-list" : ""}" data-act="fav" data-idx="${idx}"
          ${editFavs ? `aria-label="Supprimer le favori ${esc(fav.name)}"` : ""}>${esc(fav.name)}${editFavs ? `<span class="fav-del">×</span>` : ""}</button>`;
      }).join("");
    if (!chips) return "";
    return `<div class="quick-section">
      <div class="quick-label">${esc(cat.label)}</div>
      <div class="fav-wrap">${chips}</div>
    </div>`;
  }).join("");
}

// ─── EVENTS (un seul écouteur, aucune donnée dans des onclick) ────────────────
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  switch (el.dataset.act) {
    case "add":       addItem(); break;
    case "cat":       catTouched = true; selectCat(el.dataset.cat); break;
    case "sugg":      if (!el.classList.contains("in-list")) pickSuggestion(Number(el.dataset.i)); break;
    case "toggle":    toggleItem(el.dataset.id); break;
    case "del":       removeItem(el.dataset.id); break;
    case "clear":     clearChecked(); break;
    case "quick":     toggleQuick(); break;
    case "edit-favs": toggleEditFavs(); break;
    case "fav": {
      const idx = Number(el.dataset.idx);
      const fav = favs[idx];
      if (!fav) break;
      if (editFavs) removeFav(idx);
      else if (!el.classList.contains("in-list")) quickAdd(fav.name, normCat(fav.category));
      break;
    }
  }
});

const itemInput = document.getElementById("item-input");
itemInput.addEventListener("input", () => {
  activeSugg = -1;
  if (!itemInput.value.trim()) catTouched = false;
  autoCategory();
  renderSuggest();
});
itemInput.addEventListener("focus", renderSuggest);
itemInput.addEventListener("blur", () => setTimeout(hideSuggest, 150));
itemInput.addEventListener("keydown", e => {
  const open = !document.getElementById("suggest").hidden && sugg.length;
  if (e.key === "ArrowDown" && open) { e.preventDefault(); activeSugg = (activeSugg + 1) % sugg.length; renderSuggest(); }
  else if (e.key === "ArrowUp" && open) { e.preventDefault(); activeSugg = (activeSugg - 1 + sugg.length) % sugg.length; renderSuggest(); }
  else if (e.key === "Escape") hideSuggest();
  else if (e.key === "Enter") {
    e.preventDefault();
    if (open && activeSugg >= 0) pickSuggestion(activeSugg); else addItem();
  }
});
// Toucher une suggestion ne doit pas fermer le clavier ni la liste
["mousedown", "pointerdown"].forEach(ev =>
  document.getElementById("suggest").addEventListener(ev, e => e.preventDefault()));
document.getElementById("new-fav-form").addEventListener("submit", addFav);

// Pause quand l'app est en arrière-plan, rafraîchit au retour
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) { flush(); poll(); }
});
window.addEventListener("online", () => { flush(); poll(); });

// ─── INIT ────────────────────────────────────────────────────────────────────
document.getElementById("new-fav-cat").innerHTML =
  CATEGORIES.map(c => `<option value="${c.id}">${esc(c.label)}</option>`).join("");

restore();
loadHistory();
render();
updateSync();
flush();
poll();
setInterval(poll, POLL_MS);

// Bannière d'installation : navigateur mobile, pas déjà installé
const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
const isTouch = window.matchMedia("(hover: none)").matches;
if (!isStandalone && isTouch) document.getElementById("install-banner").style.display = "block";
</script>
